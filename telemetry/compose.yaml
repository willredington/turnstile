# An OpenTelemetry backend for looking at what Turnstile and the agent report.
#
# Start it with `bun run telemetry` (which is just `docker compose -f telemetry/compose.yaml
# up -d`), then set `"telemetry": { "enabled": true }` in `.turnstile/config.json`.
#
# Grafana's all-in-one image rather than a stack of services, because all three signals are
# needed — traces for the review pass, metrics for cost and keystroke latency, logs for the
# agent's events — and assembling Tempo, Prometheus, Loki and Grafana by hand is exactly the
# setup nobody should have to remember.

name: turnstile-telemetry

services:
  otel:
    # Pinned: the image bundles five servers, and "latest" silently changing any of them is the
    # kind of drift that turns "my telemetry stopped working" into an afternoon.
    image: grafana/otel-lgtm:0.33.1
    container_name: turnstile-otel
    restart: unless-stopped
    ports:
      # Grafana. http://localhost:3000, admin/admin.
      - '3000:3000'
      # OTLP. 4318 is the HTTP endpoint Turnstile's `telemetry.endpoint` points at; 4317 is gRPC,
      # published only so other tooling can use the same container.
      - '4317:4317'
      - '4318:4318'
    volumes:
      # Everything Grafana, Prometheus, Tempo and Loki store lives under /data, so one volume
      # keeps a session's history across a restart. `down -v` is what discards it.
      - turnstile-otel-data:/data
      # The Turnstile dashboard (Dashboards → Turnstile): cost, tokens, reviews, questions,
      # failures, and links into the traces behind them. Read-only mounts, so the checked-in
      # JSON is the source of truth.
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/turnstile.yaml:ro
      - ./grafana/turnstile-dashboard.json:/otel-lgtm/turnstile-dashboards/turnstile.json:ro
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      # Five servers start in about 5s on a warm image; this is slack for a cold one.
      start_period: 60s
      retries: 5

volumes:
  turnstile-otel-data:
