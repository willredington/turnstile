[package]
name = "desktop"
version = "2.0.0"
description = "Turnstile native desktop shell"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-store = "2.4.4"
tauri-plugin-shell = "2.3.6"

# Only needed for the raw SIGTERM/SIGKILL signaling in state.rs's terminate_gracefully — Unix
# only, since Windows has no such signals and that path stays on CommandChild's own kill().
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Only for escape.rs: a native key monitor so Escape reaches the page in macOS fullscreen.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSResponder", "NSWindow"] }

